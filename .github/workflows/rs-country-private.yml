# .github/workflows/rs-country-private.yml
#
# QUÉ HACE
# Pipeline semanal del motor RS país privado (MET-2c). Tras el cierre semanal
# de los mercados del universo v1, escribe snapshots semanales de ranking
# POR MERCADO en rs_weekly_snapshots / rs_weekly_items:
#   - US equity: statsedge-us-equity-rs-v1 (scripts/rs-universe.mjs)
#   - Intl (HK, CA, Europa-15, AU, JP): engine_version por mercado
#     (scripts/rs-country-private.mjs)
# No toca el pin de lib/rsEngines.js, scoring ni UI — solo dispara los scripts
# ya verificados en corrida manual (MET-2b, smoke HK 2026-08-30).
#
# PASOS (en orden)
#   1. rs-universe.mjs --population=equity --write — RS país US (~5.5k equity).
#   2. rs-country-private.mjs --write — RS país intl, un bucle por mercado.
# rs-fx-ingest.mjs y rs-global-private.mjs NO van aquí: el global corre en
# rs-global-private.yml (MET-1c) una hora antes. El país no depende del
# snapshot global para calcular (precios locales, sin FX), pero compartir
# barras/infra tras el cierre semanal evita carreras con refresh-bars
# (02:00 UTC) y alinea semana W (spec-rs-pais.md § Cadencia).
#
# POR QUÉ DOMINGO 07:00 UTC (después del global 06:00)
# El motor país corre tras el cierre semanal de todos los mercados del universo
# v1 (spec § Cadencia, misma política anti-lookahead que MET-1). Una hora después
# del workflow global deja margen para que FX + global terminen sin solaparse,
# y sigue sin competir con refresh-bars (02:00 UTC) ni scan-universe (03:00 UTC).
# US e intl van en el mismo job en pasos secuenciales (spec proponía 07:00 US,
# 07:15 intl; aquí ambos a las 07:00 en orden — la diferencia de 15 min no
# aporta si intl depende de US solo por orden operativo, no por datos).
# GitHub puede retrasar los horarios 5-30 minutos; en cadencia semanal no importa.
# Post-MIGRATE Mini (MIGRATE-3) el mismo par de scripts puede correr por launchd;
# este workflow es el disparador primario hasta entonces.
#
# SECRETOS QUE NECESITA (Settings → Secrets and variables → Actions →
# Repository secrets de este repositorio en GitHub, NO en este archivo):
#   - SUPABASE_URL              (o NEXT_PUBLIC_SUPABASE_URL, el script acepta
#                                 cualquiera de los dos — ver lib/supabaseServer.js)
#   - SUPABASE_SERVICE_ROLE_KEY
# Opcional: STATSEDGE_OWNER_ID — solo si el proyecto usa un owner_id distinto
# de "personal" (el valor por defecto). No hace falta si nunca se ha tocado.
# Mismos secretos que rs-global-private.yml / refresh-bars.yml / scan-universe.yml.
#
# VARIABLE DE ENTORNO ADICIONAL (no es secret)
#   STATSEDGE_UNIVERSES_GIT_SHA — git rev-parse HEAD en el checkout del job;
#   se persiste en stats del snapshot para trazabilidad del universo curado.
#
# QUÉ RAMA LO DISPARA
# Los workflows programados (schedule) de GitHub Actions SOLO se disparan
# desde la rama por defecto del repositorio. Este repo tiene
# codex/statsedge-ui-polish como rama por defecto — si cambia, este workflow
# deja de correr en cron hasta que se mueva con ella o se ajuste de nuevo.

name: RS país privado (semanal)

on:
  schedule:
    # Domingo 07:00 UTC — una hora después del global (06:00), ver "POR QUÉ DOMINGO 07:00 UTC".
    - cron: "0 7 * * 0"
  workflow_dispatch: {}
    # Disparo manual desde la pestaña Actions (smoke o recuperación sin esperar
    # al domingo). Usa --write en ambos pasos; para probar flags sin escribir,
    # ejecutar localmente sin --write (dry-run por defecto de los scripts).

# No solapar dos corridas semanales sobre el mismo snapshot (p. ej. manual
# mientras el cron sigue en vuelo).
concurrency:
  group: rs-country-private
  cancel-in-progress: false

jobs:
  rs-country-private:
    runs-on: ubuntu-latest
    # US equity (~5.5k) + intl multi-mercado (~19 mercados): margen amplio sobre
    # corrida manual MET-2b; primera ejecución real en Actions confirmará duración.
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Resolve universes git SHA
        id: universes
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Compute US country RS snapshot (--write)
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          STATSEDGE_OWNER_ID: ${{ secrets.STATSEDGE_OWNER_ID }}
          STATSEDGE_UNIVERSES_GIT_SHA: ${{ steps.universes.outputs.sha }}
        # Sin --env-file: credenciales vía env:, igual que rs-global-private.yml.
        run: |
          node --loader ./scripts/loader.mjs scripts/rs-universe.mjs \
            --population=equity --write

      - name: Compute intl country RS snapshots (--write)
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          STATSEDGE_OWNER_ID: ${{ secrets.STATSEDGE_OWNER_ID }}
          STATSEDGE_UNIVERSES_GIT_SHA: ${{ steps.universes.outputs.sha }}
        run: |
          node --loader ./scripts/loader.mjs scripts/rs-country-private.mjs \
            --write --concurrency=8
