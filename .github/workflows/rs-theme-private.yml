# .github/workflows/rs-theme-private.yml
#
# QUÉ HACE
# Pipeline semanal del motor RS tema privado (MET-3c). Tras el cierre semanal
# de los mercados del universo v1 y los workflows global (06:00) y país (07:00),
# escribe snapshots semanales de ranking POR TEMA en rs_weekly_snapshots /
# rs_weekly_items: 12 THEME_RULES curadas, precios USD vía FX
# (scripts/rs-theme-private.mjs).
# No toca el pin de lib/rsEngines.js, scoring ni UI — solo dispara el script
# ya verificado en corrida manual (MET-3b, smoke AGX=52, 2026-08-31).
#
# PASOS (en orden)
#   1. rs-theme-private.mjs --write — bucle interno de las 12 keys curadas.
# rs-fx-ingest.mjs y rs-global-private.mjs NO van aquí: el global corre en
# rs-global-private.yml (MET-1c) a las 06:00 UTC. El tema depende de FX
# (precios USD) y de perfiles sector/industria actualizados, pero no del
# snapshot global para calcular; compartir infra tras cierre semanal evita
# carreras con refresh-bars (02:00 UTC) y alinea semana W (spec-rs-tema.md § Cadencia).
#
# POR QUÉ DOMINGO 07:30 UTC (después del país 07:00 y global 06:00)
# El motor tema corre tras global + país para reutilizar barras/FX ya
# refrescadas y perfiles sector/industria alineados con la semana W
# (spec § Cadencia, misma política anti-lookahead que MET-1/2). Media hora
# después del workflow país deja margen para que US + intl terminen sin
# solaparse, y sigue sin competir con refresh-bars (02:00 UTC) ni
# scan-universe (03:00 UTC).
# GitHub puede retrasar los horarios 5-30 minutos; en cadencia semanal no importa.
# Post-MIGRATE Mini (MIGRATE-3) el mismo script puede correr por launchd;
# este workflow es el disparador primario hasta entonces.
#
# SECRETOS QUE NECESITA (Settings → Secrets and variables → Actions →
# Repository secrets de este repositorio en GitHub, NO en este archivo):
#   - SUPABASE_URL              (o NEXT_PUBLIC_SUPABASE_URL, el script acepta
#                                 cualquiera de los dos — ver lib/supabaseServer.js)
#   - SUPABASE_SERVICE_ROLE_KEY
# Opcional: STATSEDGE_OWNER_ID — solo si el proyecto usa un owner_id distinto
# de "personal" (el valor por defecto). No hace falta si nunca se ha tocado.
# Mismos secretos que rs-global-private.yml / rs-country-private.yml.
#
# VARIABLES DE ENTORNO ADICIONALES (no son secret)
#   STATSEDGE_UNIVERSES_GIT_SHA — git rev-parse HEAD en el checkout del job;
#   se persiste en stats del snapshot para trazabilidad del universo curado.
#   STATSEDGE_BUSINESS_THEME_GIT_SHA — mismo HEAD; trazabilidad de THEME_RULES.
#
# QUÉ RAMA LO DISPARA
# Los workflows programados (schedule) de GitHub Actions SOLO se disparan
# desde la rama por defecto del repositorio. Este repo tiene
# codex/statsedge-ui-polish como rama por defecto — si cambia, este workflow
# deja de correr en cron hasta que se mueva con ella o se ajuste de nuevo.

name: RS tema privado (semanal)

on:
  schedule:
    # Domingo 07:30 UTC — media hora después del país (07:00), ver "POR QUÉ DOMINGO 07:30 UTC".
    - cron: "30 7 * * 0"
  workflow_dispatch: {}
    # Disparo manual desde la pestaña Actions (smoke o recuperación sin esperar
    # al domingo). Usa --write; para probar flags sin escribir, ejecutar
    # localmente sin --write (dry-run por defecto del script).

# No solapar dos corridas semanales sobre el mismo snapshot (p. ej. manual
# mientras el cron sigue en vuelo).
concurrency:
  group: rs-theme-private
  cancel-in-progress: false

jobs:
  rs-theme-private:
    runs-on: ubuntu-latest
    # 12 temas × universo MET-1 (~3.2k símbolos): corrida local write ~2 min;
    # margen amplio para perfiles sector/industria y FX.
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Resolve git SHAs
        id: git_sha
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Compute theme RS snapshots (--write)
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          STATSEDGE_OWNER_ID: ${{ secrets.STATSEDGE_OWNER_ID }}
          STATSEDGE_UNIVERSES_GIT_SHA: ${{ steps.git_sha.outputs.sha }}
          STATSEDGE_BUSINESS_THEME_GIT_SHA: ${{ steps.git_sha.outputs.sha }}
        # Sin --env-file: credenciales vía env:, igual que rs-global-private.yml.
        run: |
          node --loader ./scripts/loader.mjs scripts/rs-theme-private.mjs \
            --write --concurrency=10
