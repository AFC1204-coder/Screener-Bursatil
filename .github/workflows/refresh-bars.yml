# .github/workflows/refresh-bars.yml
#
# QUÉ HACE
# Ejecuta scripts/refresh-bars.mjs --write cada noche para refrescar las
# barras diarias (daily_bars) del universo estadounidense investable en
# Supabase. Es un refresco INCREMENTAL: con --stale-days=1 (el valor por
# defecto del script), solo descarga y escribe los símbolos cuya última
# barra tiene un día o más de antigüedad. Ojo con el matiz, que es lo que
# el guardián retirado entendía mal: cada día laborable eso son CASI TODOS
# los símbolos (~5.600), porque a todos les falta la sesión de ayer. Lo
# incremental no es cuántos símbolos se visitan, sino cuánto se escribe:
# desde el delta de d0a628b son ~1 barra por símbolo, unas pocas miles de
# filas, no las ~2,24 millones de reescribir la serie entera.
#
# FRENO CONTRA CARGA MASIVA
# El script lleva un tope acumulado de FILAS ESCRITAS (ver "TOPE DE FILAS
# ESCRITAS" en scripts/refresh-bars.mjs): por defecto 200.000 filas,
# ajustable con --max-filas=N. Al alcanzarlo deja de tomar símbolos
# nuevos, espera a los que están en vuelo y reporta cuántos quedaron sin
# procesar — hace trabajo útil hasta el tope en vez de negarse a empezar.
# Ese es el freno contra una repetición de la carga masiva del 9 de agosto
# (~700.000 filas, instancia Supabase Micro caída 4 horas); este workflow
# no añade lógica propia, delega en el script.
#
# Sustituye al guardián anterior, que contaba símbolos "caducados" y
# abortaba por encima de 1.000 (--max-carga-masiva /
# --permitir-carga-masiva, ambas banderas ya no existen). Medía lo que no
# debe: caducados son todos los símbolos cada día laborable, así que
# abortó la única ejecución real de este workflow con 5.605 de 5.605, y
# costaba ~4 minutos de precálculo por corrida. Lo que hace segura la
# operación diaria es el delta de escritura (commit d0a628b): solo se
# escriben las barras que faltan o cambiaron, unas pocas miles por noche
# en vez de ~2,24 millones.
#
# CÓDIGOS DE SALIDA del script (el job se marca en rojo si != 0):
#   0 = procesó todos los símbolos seleccionados.
#   1 = error fatal (Supabase sin configurar, excepción no atrapada).
#   2 = corrida incompleta: paró al llegar al tope de filas.
#
# POR QUÉ A LAS 02:00 UTC
# Los crons de Vercel (vercel.json) corren entre las 22:20 y las 23:41 UTC.
# 02:00 UTC deja más de dos horas de margen tras el último cron de Vercel
# (shadow-firds-refresh, 23:30 UTC aprox. con su propio procesamiento), para
# no competir por la misma instancia Supabase (Micro, 1 GB) mientras esos
# crons aún puedan estar escribiendo.
#
# SECRETOS QUE NECESITA (Settings → Secrets and variables → Actions →
# Repository secrets de este repositorio en GitHub, NO en este archivo):
#   - SUPABASE_URL              (o NEXT_PUBLIC_SUPABASE_URL, el script acepta
#                                 cualquiera de los dos — ver lib/supabaseServer.js)
#   - SUPABASE_SERVICE_ROLE_KEY
# Opcional: STATSEDGE_OWNER_ID — solo si el proyecto usa un owner_id distinto
# de "personal" (el valor por defecto). No hace falta si nunca se ha tocado.
#
# QUÉ RAMA LO DISPARA
# Los workflows programados (schedule) de GitHub Actions SOLO se disparan
# desde la rama por defecto del repositorio. Este repo tiene
# codex/statsedge-ui-polish como rama por defecto (cambiada a propósito
# para esto) — si esa rama cambia, este workflow deja de correr en cron
# hasta que se mueva con él o se ajuste `on.push`/rama por defecto de nuevo.

name: Refresh daily bars (US)

on:
  # CRON DESACTIVADO (2026-08-10) — ver docs/frescura-sesion-2026-08-10.md.
  # Las dos causas por las que se desactivó ya están resueltas: la
  # reescritura de la serie entera (~2,2M filas/noche) la arregló el delta
  # de d0a628b, y el guardián que abortaba cada noche se ha sustituido por
  # el tope de filas escritas descrito arriba.
  # Aun así se deja comentado A PROPÓSITO: reactivarlo es una decisión
  # aparte, y se toma después de ver una corrida manual real
  # (workflow_dispatch) que termine con código 0 y un número de filas
  # escritas del orden de unas pocas miles. Para reactivar, descomentar:
  #   schedule:
  #     - cron: "0 2 * * *"
  workflow_dispatch: {}
    # Disparo manual desde la pestaña Actions, para probar sin esperar a
    # las 02:00 UTC.

# Si un disparo manual se lanza mientras el de anoche sigue corriendo (no
# debería, ver timeout-minutes), no se solapan sobre el mismo cursor de
# símbolos.
concurrency:
  group: refresh-bars
  cancel-in-progress: false

jobs:
  refresh-bars:
    runs-on: ubuntu-latest
    # Acotado muy por debajo del máximo de 6h del plan gratuito de Actions.
    # La corrida de carga inicial completa (~5.600 símbolos, la más lenta
    # posible) midió 18 minutos a concurrency=4. Un refresco diario normal
    # es mucho más corto (solo símbolos caducados de un día); 30 minutos
    # deja margen sin acercarse al límite del plan.
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Refresh daily bars (--write)
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          STATSEDGE_OWNER_ID: ${{ secrets.STATSEDGE_OWNER_ID }}
        # Sin --env-file: en Actions las credenciales llegan por variables de
        # entorno normales (bloque `env:` de arriba), que es como
        # lib/supabaseServer.js las lee (envValue → process.env). --env-file
        # es solo la forma de cargarlas en local desde .env.local; aquí no
        # existe ese archivo ni hace falta.
        # concurrency=4: la que ya está medida y funciona (18 min para la
        # población completa). stale-days=1 es el valor por defecto del
        # script — no hace falta repetirlo, se deja explícito por claridad.
        run: |
          node --loader ./scripts/loader.mjs scripts/refresh-bars.mjs \
            --write --concurrency=4 --stale-days=1
